# Publishes every releases/vX.Y.Z/ folder (installer + latest.json) that has
# no GitHub release yet. Runs when such a folder is pushed to main. Installed
# copies of Racing Tools read releases/latest/download/latest.json and update
# themselves.
name: Publish release
on:
  push:
    branches: [main]
    paths: ["releases/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create missing releases (oldest first, newest marked latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for dir in $(ls -d releases/v*/ | sed 's#/$##' | sort -V); do
            tag=$(basename "$dir")
            test -f "$dir/latest.json" || continue
            if gh release view "$tag" >/dev/null 2>&1; then continue; fi
            notes=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['notes'])" "$dir/latest.json")
            gh release create "$tag" "$dir"/* --target "$GITHUB_SHA" --title "Racing Tools ${tag#v}" --notes "$notes" --latest
          done
